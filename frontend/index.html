<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro | Sistema de Autenticação</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
    <div class="card border-0 shadow-sm" style="max-width: 460px; width: 100%;">
      <div class="card-body p-4 p-md-5">
        <h1 class="h3 text-center mb-2">Criar conta</h1>
        <p class="text-secondary text-center mb-4">Preencha seus dados para se cadastrar.</p>

        <form id="registerForm" novalidate>
          <div class="mb-3">
            <label for="name" class="form-label">Nome</label>
            <input type="text" class="form-control" id="name" name="name" autocomplete="name" required>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">E-mail</label>
            <input type="email" class="form-control" id="email" name="email" autocomplete="email" required>
          </div>
          <div class="mb-4">
            <label for="password" class="form-label">Senha</label>
            <input type="password" class="form-control" id="password" name="password" minlength="6" autocomplete="new-password" required>
            <div class="form-text">Use pelo menos 6 caracteres.</div>
          </div>
          <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
        </form>

        <p class="text-center mt-4 mb-0">Já possui uma conta? <a href="login.html">Entrar</a></p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="script.js"></script>
</body>
</html>
