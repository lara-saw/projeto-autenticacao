<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel da Lara</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="theme.css" rel="stylesheet">
</head>
<body class="kitty-page">
  <nav class="navbar kitty-nav px-3 px-md-4 py-3">
    <span class="navbar-brand fw-bold mb-0"><span class="brand-bow">🎀</span> Cantinho da Lara</span>
    <button id="logoutButton" class="btn btn-outline-danger btn-sm">Sair</button>
  </nav>

  <main class="container py-5">
    <section class="hero-card p-4 p-md-5 mb-4 text-center">
      <div class="kitty-face" aria-hidden="true">
        <div class="kitty-eyes">● ●</div><div class="kitty-nose">●</div><span class="kitty-bow">🎀</span>
      </div>
      <span class="badge rounded-pill badge-kitty mb-2">Painel exclusivo</span>
      <h1 class="display-6 fw-bold">Olá, Lara!</h1>
      <p class="mb-0 text-secondary">Aqui estão todas as pessoas que já criaram uma conta.</p>
    </section>

    <section class="users-card p-3 p-md-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h4 mb-0">Usuários cadastrados</h2>
        <span id="userCount" class="badge rounded-pill text-bg-danger">0</span>
      </div>
      <div id="loading" class="text-center py-4 text-secondary">Carregando usuários...</div>
      <div class="table-responsive d-none" id="tableWrapper">
        <table class="table table-hover table-kitty mb-0">
          <thead><tr><th>Nome</th><th>E-mail</th><th>Cadastro</th></tr></thead>
          <tbody id="usersTableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="dashboard.js"></script>
</body>
</html>
