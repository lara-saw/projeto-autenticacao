services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "localhost:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      AUTH_SECRET: ${AUTH_SECRET:-troque-esta-chave-no-coolify}
    expose:
      - "3000"
    volumes:
      - backend_data:/app/data

volumes:
  backend_data:
