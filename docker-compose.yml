services:
  frontend:
    image: nginx:alpine
    command: /bin/sh -c "cp /usr/share/nginx/html/site.conf /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend

  backend:
    image: node:18-alpine
    working_dir: /app
    environment:
      AUTH_SECRET: ${AUTH_SECRET:-desenvolvimento-local}
    command: sh -c "npm install && node server.js"
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - backend_data:/app/data

volumes:
  backend_node_modules:
  backend_data:
